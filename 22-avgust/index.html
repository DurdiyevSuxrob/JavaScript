<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="stley.css" />
  </head>
  <body>
    <button class="open-btn">Tizimga kirish</button>
    <div class="modal">
      <form class="modal-content">
        <label for="ism">Ismingizni yozing</label>
        <input type="text" name="ism" id="ism" />
        <label for="parol">Parolingizni kiriting</label>
        <input type="password" name="parol" id="parol" required />
        <button class="send">Yuborish</button>

        <button class="close-btn">Yopish</button>
      </form>
    </div>

    <script>
      const openBtn = document.querySelector(".open");
      const closeBtn = document.querySelector(".close-btn");
      const modal = document.querySelector(".modal");

      openBtn.addEventListener("click", () => {
        modal.classList.add("active");
      });
      closeBtn.addEventListener("click", () => {
        modal.classList.remove("active");
      });
    </script>
  </body>
</html>
