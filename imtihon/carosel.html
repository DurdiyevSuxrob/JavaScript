    <h2>carusel</h2>

        <div class="card" style="background-color: deeppink">5</div>

        <div class="card" style="background-color: deeppink">5</div>
      </div>
    </div>

    <div class="controls">
      <button id="prevBtn"><i class="ri-arrow-left-fill"></i></button>
      <button id="nexBtn"><i class="ri-arrow-right-fill"></i></button>
    </div>

    <script src="carosel.js"></script>
