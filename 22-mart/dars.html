<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .div {
            width: 1000%;
            height: 1000vh;
            background-color: black;
            
        }
        h1 {
            animation-name: suxrob;
            animation-delay: 0s;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            color: aliceblue;
        }
        @keyframes suxrob {
            25% {
             color: darkgoldenrod;
                /* transform: translate(1200px); */
            }
            50% {
                color: aqua;
                transform: translate(1200px);
            }
            75% {
                color: chartreuse;
                margin-bottom: 100px;
                transform: translateY(650px);
                
            }
            85% {
                color: blue;
                transform: translateX(1000px);
            }
            100% {
                color: brown;
            


            }
        }









    </style>
    <div class="div">
        <h1>SUXROB</h1>
    </div>
</body>
</html>
